name: _terraform

# Reusable engine: plan on PRs (read-only), gated apply on merge to main
# (read/write). Called by each project's own workflow with its directory.
on:
  workflow_call:
    inputs:
      working_directory:
        description: Path to the project's Terraform config.
        required: true
        type: string
      environment:
        description: GitHub environment gating the apply job (approval gate).
        required: false
        type: string
        default: production
      terraform_version:
        required: false
        type: string
        default: "1.15.8"

permissions:
  contents: read
  id-token: write # OIDC: request a token to assume the AWS role
  pull-requests: write # for the plan comment

jobs:
  # ---- Plan on PRs (read-only role, no state writes) ---------------------
  plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ inputs.terraform_version }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Format check
        run: terraform fmt -check -recursive

      - name: Init
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.AWS_STATE_BUCKET }}" \
            -backend-config="region=${{ vars.AWS_REGION }}"

      - name: Validate
        run: terraform validate

      - name: Plan
        id: plan
        run: terraform plan -lock=false -no-color -input=false | tee plan.txt
        continue-on-error: true

      - name: Comment plan on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = `${{ inputs.working_directory }}/plan.txt`;
            let plan = fs.existsSync(path) ? fs.readFileSync(path, 'utf8') : '(no plan output)';
            if (plan.length > 60000) plan = plan.slice(0, 60000) + '\n... (truncated)';
            const body = `#### Terraform Plan — \`${{ inputs.working_directory }}\` \`${{ steps.plan.outcome }}\`\n<details><summary>Show plan</summary>\n\n\`\`\`\n${plan}\n\`\`\`\n</details>`;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

      - name: Fail if plan errored
        if: steps.plan.outcome == 'failure'
        run: exit 1

  # ---- Apply on merge to main (read/write role, gated by environment) ----
  apply:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ inputs.terraform_version }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Init
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.AWS_STATE_BUCKET }}" \
            -backend-config="region=${{ vars.AWS_REGION }}"

      - name: Apply
        run: terraform apply -auto-approve -input=false
